[project]
name = "see-benchmarks"
version = "0.1.0"
description = "Référentiels locaux sourcés et signés de See The Future (phase 08)."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43,<46",
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.2",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["see_benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
