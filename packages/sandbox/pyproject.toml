[project]
name = "see-sandbox"
version = "0.1.0"
description = "Sandbox Pyodide et analyse statique des scripts générés (phase 07)."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["see_sandbox"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
