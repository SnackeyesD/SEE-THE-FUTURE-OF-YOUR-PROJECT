[project]
name = "see-reporting"
version = "0.1.0"
description = "Rapports déterministes de See The Future : données dérivées, jamais recalculées (phase 15)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "see-engine",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.7",
]

[tool.uv.sources]
see-engine = { path = "../engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["see_reporting"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
