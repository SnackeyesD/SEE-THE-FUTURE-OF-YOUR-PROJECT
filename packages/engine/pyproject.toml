[project]
name = "see-engine"
version = "0.1.0"
description = "Moteur de simulation déterministe de See The Future (phase 02)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.2",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: benchmarks et tests de performance non bloquants",
]
